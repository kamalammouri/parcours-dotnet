<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : sommaire à gauche (parties → chapitres → leçons), leçon à droite ; sur mobile le sommaire devient un tiroir. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #171a21; --muted: #5d6474; --line: #dde1e8;
  --accent: #2f55d4; --accent-soft: #e6ecfd; --ok: #1d8a5b; --ok-soft: #e2f4ea;
  --warn: #a8620b; --warn-soft: #fbf0df; --hard: #b3304a; --hard-soft: #fbe6ea;
  --code-bg: #f0f2f6; --code-fg: #1e2330; --console-bg: #161a22; --console-fg: #d7f5e3;
  --tk-kw: #2f55d4; --tk-str: #1d7a4e; --tk-com: #7c8394; --tk-num: #a8620b; --tk-type: #8a3fb8; --tk-fn: #b3304a;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa2b2; --line: #2b313d;
  --accent: #7d9bff; --accent-soft: #232c45; --ok: #4fc38c; --ok-soft: #173327;
  --warn: #e2a24c; --warn-soft: #3a2c16; --hard: #f07a90; --hard-soft: #3b1e26;
  --code-bg: #0e1116; --code-fg: #dfe3ea; --console-bg: #07090c; --console-fg: #b9f0d0;
  --tk-kw: #8fa8ff; --tk-str: #7fd3a4; --tk-com: #6f7788; --tk-num: #e8b26a; --tk-type: #d09cf0; --tk-fn: #f39aab;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --fg: #e6e9ef; --muted: #9aa2b2; --line: #2b313d;
  --accent: #7d9bff; --accent-soft: #232c45; --ok: #4fc38c; --ok-soft: #173327;
  --warn: #e2a24c; --warn-soft: #3a2c16; --hard: #f07a90; --hard-soft: #3b1e26;
  --code-bg: #0e1116; --code-fg: #dfe3ea; --console-bg: #07090c; --console-fg: #b9f0d0;
  --tk-kw: #8fa8ff; --tk-str: #7fd3a4; --tk-com: #6f7788; --tk-num: #e8b26a; --tk-type: #d09cf0; --tk-fn: #f39aab;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 17px/1.65 var(--f-body); }
a { color: var(--accent); }
code { font: .88em var(--f-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding-block: 20px 32px; padding-inline: 18px; }
.brand { font: 700 1.25rem var(--f-display); margin: 0 0 4px; }
.brand a { color: var(--fg); text-decoration: none; }
.brand-sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.bar-label { font-size: .82rem; color: var(--muted); margin: 6px 0 18px; font-variant-numeric: tabular-nums; }
.part { margin-bottom: 14px; }
.part > h2 { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-family: var(--f-body); font-weight: 600; }
.chap > summary { cursor: pointer; font-weight: 600; font-size: .93rem; padding: 5px 8px; border-radius: 6px; list-style-position: outside; margin-left: 14px; }
.chap > summary:hover { background: var(--bg); }
.chap > summary small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.side ol { list-style: none; margin: 2px 0 6px; padding: 0; display: grid; gap: 1px; }
.side ol a { display: grid; grid-template-columns: 38px 1fr 14px; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: .9rem; line-height: 1.3; }
.side ol a:hover { background: var(--bg); }
.side ol a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side .n { font: 600 .74rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.side .chk { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.side a.done .chk { background: var(--ok); border-color: var(--ok); }
.side a.pending { opacity: .5; }

.main { padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 820px; margin: 0 auto; }
.topbar { display: none; }

.eyebrow { font: 600 .8rem var(--f-mono); color: var(--accent); letter-spacing: .04em; margin: 0 0 8px; }
.day-head h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0 0 10px; }
.summary { color: var(--muted); font-size: 1.1rem; margin: 0 0 22px; max-width: 65ch; }

section.block { margin: 0 0 40px; }
section.block > h2 { font-size: 1.4rem; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
section.block > h2 small { font: 500 .85rem var(--f-body); color: var(--muted); }
.objectives { margin: 0; padding-left: 1.2em; }
.lesson { max-width: 70ch; }
.lesson h3 { font-size: 1.18rem; margin: 28px 0 8px; }
.lesson h4 { font-size: 1rem; margin: 0 0 6px; }
.lesson p, .lesson li { margin: 0 0 10px; }
.lesson pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 13.5px/1.55 var(--f-mono); }
.lesson pre code { background: none; padding: 0; }
table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; font-size: .95rem; }
:not(pre) > code { overflow-wrap: anywhere; }
pre { overflow-x: auto; max-width: 100%; }
h1, h2, h3 { overflow-wrap: anywhere; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.lesson th { background: var(--panel); }

/* Encadrés */
.analogy, .note, .tip { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 16px; margin: 18px 0; }
.analogy::before, .note::before, .tip::before { display: block; font: 600 .74rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.analogy { background: var(--accent-soft); border-color: transparent; font-size: 1.05rem; }
.analogy::before { content: "Pour comprendre"; color: var(--accent); }
.note::before { content: "Niveau senior"; color: var(--accent); }
.tip { background: var(--warn-soft); border-color: transparent; }
.tip::before { content: "À retenir"; color: var(--warn); }
.analogy p:last-child, .note p:last-child, .tip p:last-child { margin-bottom: 0; }

/* Schémas */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0; }
.flow > span { border: 1.5px solid var(--accent); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-size: .92rem; font-weight: 600; text-align: center; }
.flow > .arr { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.compare > div { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.compare > div:first-child { border-top: 3px solid var(--hard); }
.compare > div:last-child { border-top: 3px solid var(--ok); }
.lesson pre.diagram { background: var(--panel); border-style: dashed; line-height: 1.35; }

/* Exemples */
.ex { margin: 0 0 30px; }
.ex h3 { font-size: 1.08rem; margin: 0 0 8px; }
.ex .explain { margin: 10px 0 0; color: var(--muted); font-size: .97rem; }
.code { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.55 var(--f-mono); color: var(--code-fg); tab-size: 4; }
.code pre code { background: none; padding: 0; font: inherit; }
.copy { position: absolute; top: 8px; right: 8px; font-size: .75rem; padding: 3px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 5px; }
.copy:hover { color: var(--fg); }
.output { margin: 8px 0 0; border-radius: 8px; overflow: hidden; background: var(--console-bg); }
.output::before { content: "Résultat dans la console"; display: block; padding: 6px 14px 0; font: 600 .7rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #8b93a3; }
.output pre { margin: 0; padding: 6px 14px 12px; overflow-x: auto; font: 13px/1.5 var(--f-mono); color: var(--console-fg); }
.steps { margin: 12px 0 0; border-left: 2px solid var(--line); padding: 2px 0 2px 16px; }
.steps h4 { margin: 0 0 6px; font: 600 .78rem var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.steps ol { margin: 0; padding-left: 1.2em; }
.steps li { margin: 0 0 6px; }
.token.keyword, .token.boolean, .token.important { color: var(--tk-kw); }
.token.string, .token.char, .token.attr-value, .token.interpolation-string { color: var(--tk-str); }
.token.comment, .token.prolog { color: var(--tk-com); font-style: italic; }
.token.number { color: var(--tk-num); }
.token.class-name, .token.namespace, .token.builtin { color: var(--tk-type); }
.token.function { color: var(--tk-fn); }
.token.punctuation, .token.operator { color: var(--muted); }

/* Exercices */
.task { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px; }
.task-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
.task-head h3 { font-size: 1.05rem; margin: 0; flex: 1 1 240px; }
.lvl { font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; }
.lvl.facile { background: var(--ok-soft); color: var(--ok); }
.lvl.moyen { background: var(--warn-soft); color: var(--warn); }
.lvl.difficile { background: var(--hard-soft); color: var(--hard); }
.task details { margin-top: 10px; }
.task summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .95rem; }
.task details > div { margin-top: 8px; }
.ex-done { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }

/* Quiz */
.quiz-q { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px; margin: 0 0 12px; }
.quiz-q > p { margin: 0 0 10px; font-weight: 600; }
.quiz-opts { display: grid; gap: 6px; }
.quiz-opts button { text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: .97rem; }
.quiz-opts button:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opts button:disabled { cursor: default; }
.quiz-opts button.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-opts button.wrong { border-color: var(--hard); background: var(--hard-soft); }
.quiz-why { margin: 10px 0 0; font-size: .95rem; color: var(--muted); }
.quiz-why b { color: var(--fg); }
.quiz-score { font-weight: 600; margin: 4px 0 0; }

.project { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 14px 18px; border-radius: 0 8px 8px 0; }
.resources { margin: 0; padding-left: 1.2em; }

.day-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 20px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 9px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: .95rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.is-done { background: var(--ok); border-color: var(--ok); color: var(--panel); }

/* Accueil */
.hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 12px; }
.hero p { max-width: 62ch; color: var(--muted); font-size: 1.1rem; margin: 0 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.home-h { font-size: 1.2rem; margin: 36px 0 12px; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 36px; }
.split div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.split b { display: block; font: 700 1.05rem var(--f-display); margin-bottom: 2px; }
.split span { color: var(--muted); font-size: .92rem; }
.weeks { display: grid; gap: 14px; }
.week-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.week-card h2 { font-size: 1.15rem; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.week-card h2 small { font: 500 .85rem var(--f-mono); color: var(--muted); }
.week-card p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; max-width: 70ch; }
.week-card ul { margin: 0; padding-left: 1.1em; font-size: .93rem; columns: 2; column-gap: 28px; }
.week-card li { break-inside: avoid; }
.week-card a { text-decoration: none; }
.week-card li small { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(330px, 90vw); z-index: 20; transform: translateX(-100%); transition: transform .2s; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgb(0 0 0 / .35); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .compare { grid-template-columns: minmax(0, 1fr); }
  .week-card ul { columns: 1; }
  .main { padding-top: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
// Le parcours : parties → chapitres → clés de leçons, dans l'ordre. L'ancre de chaque leçon est sa clé (#l-list).
const PARTS = [
  { title: "Fondamentaux .NET et C#", text: "Pour partir de zéro : la plateforme, la syntaxe, la programmation orientée objet, les types, les collections, LINQ, les fichiers et l'asynchrone. Des leçons courtes, une notion à la fois, avec analogies, schémas, code expliqué ligne par ligne et un quiz à la fin.",
    chapters: [
      { title: "Découvrir .NET", items: ["l-dotnet-intro", "l-how-code-runs", "l-install", "l-first-program", "l-projects", "l-nuget", "l-debugging"] },
      { title: "Les bases du langage", items: ["l-variables-numbers", "l-text-basics", "l-bool-operators", "l-var-const-conversions", "l-console-io", "l-if-else", "l-switch", "l-loops", "l-foreach", "l-arrays", "l-methods", "l-methods-advanced", "l-strings", "l-dates"] },
      { title: "Programmation orientée objet", items: ["l-class-object", "l-fields-properties", "l-constructors", "l-access-modifiers", "l-static-members", "l-static-classes", "l-const-readonly", "l-encapsulation", "l-inheritance", "l-virtual-override", "l-abstract", "l-sealed-new-partial", "l-interfaces", "l-polymorphism", "l-abstract-vs-interface", "l-namespaces"] },
      { title: "Types et mémoire", items: ["l-value-reference", "l-struct", "l-record", "l-choose-type", "l-enums", "l-null", "l-exceptions", "l-custom-exceptions", "l-memory-gc"] },
      { title: "Collections, génériques et LINQ", items: ["l-list", "l-dictionary", "l-other-collections", "l-choose-collection", "l-generics", "l-generic-constraints", "l-delegates", "l-lambdas", "l-events", "l-linq-filter", "l-linq-aggregate", "l-linq-join-deferred", "l-extension-methods"] },
      { title: "Fichiers, JSON et asynchrone", items: ["l-files", "l-json", "l-why-async", "l-async-await", "l-async-cancel-errors", "l-threads-race", "l-lock-concurrent", "l-parallel-tasks"] },
    ] },
  { title: "SQL Server et ADO.NET", text: "Le SQL dont un développeur a besoin, puis ADO.NET pas à pas : connexions, commandes, lecture, paramètres, transactions, procédures stockées, insertion en masse et Dapper.",
    chapters: [
      { title: "SQL Server pour développeurs", items: ["sql-install","sql-tables","sql-select","sql-joins","sql-group","sql-modify","sql-indexes","sql-transactions"] },
      { title: "ADO.NET : les bases", items: ["ado-intro","ado-connection","ado-command","ado-reader","ado-params","ado-async"] },
      { title: "ADO.NET avancé et Dapper", items: ["ado-transactions","ado-procs","ado-bulk","ado-repository","ado-dapper"] } ] },
  { title: "Maîtrise d'EF Core", text: "Du premier DbContext aux migrations en équipe, les relations et les requêtes, puis le change tracker, la concurrence, la performance et les tests.",
    chapters: [
      { title: "EF Core : les bases", items: ["ef-what","ef-setup","ef-first-crud","ef-conventions","ef-annotations-fluent","ef-migrations","ef-migrations-team"] },
      { title: "Relations et requêtes", items: ["ef-one-to-many","ef-one-to-one","ef-many-to-many","ef-loading","ef-linq-queries","ef-raw-sql"] },
      { title: "Suivi des modifications, performance et tests", items: ["ef-change-tracker","ef-savechanges-transactions","ef-concurrency","ef-bulk","ef-advanced-modeling","ef-performance","ef-testing","ef-vs-dapper"] } ] },
  { title: "Créer des APIs avec ASP.NET Core", text: "HTTP et REST, le pipeline, l'injection de dépendances, les endpoints, les DTOs et la validation, une API CRUD complète, puis la sécurité.",
    chapters: [
      { title: "HTTP et ASP.NET Core", items: ["api-http","api-rest","api-first-app","api-middleware","api-di","api-config"] },
      { title: "Construire les endpoints", items: ["api-controllers","api-routing-binding","api-minimal","api-dtos","api-validation","api-errors"] },
      { title: "Une API complète", items: ["api-logging","api-crud-ef","api-paging-filtering","api-patch-files","api-openapi","api-versioning"] },
      { title: "Sécurité et services externes", items: ["api-auth-jwt","api-authorization","api-cors-ratelimit","api-httpclient"] } ] },
  { title: "Architecture, patterns et tests", text: "Tester son code, organiser une application (SOLID, couches, Clean Architecture, CQRS, DDD), et les design patterns utiles au quotidien.",
    chapters: [
      { title: "Tester son code", items: ["tst-why","tst-xunit","tst-mocks","tst-integration"] },
      { title: "Architecture d'une application", items: ["arc-solid-1","arc-solid-2","arc-layers","arc-clean","arc-cqrs","arc-ddd","arc-result"] },
      { title: "Design patterns", items: ["pat-intro","pat-factory-builder","pat-singleton-di","pat-adapter-facade","pat-decorator","pat-strategy","pat-observer","pat-command-chain","pat-anti"] } ] },
  { title: "Mise en production", text: "Cache, tâches de fond, files de messages, résilience, observabilité, Docker et CI/CD, puis la préparation à l'entretien.",
    chapters: [
      { title: "Mettre une API en production", items: ["prod-caching","prod-background","prod-messaging","prod-resilience","prod-observability","prod-docker","prod-cicd","prod-checklist","prod-interview"] } ] },
  { bonus: true, title: "Bonus", text: "À faire quand tu veux, après la partie concernée : performance, temps réel, gRPC, Aspire, projet final, documentation et revue de code.",
    chapters: [
      { title: "Bonus", items: ["bon-performance","bon-signalr","bon-grpc","bon-aspire","bon-final-project","bon-architecture-docs","bon-self-review"] } ] },
];

const keyOf = d => d.key || (d.week === 0 ? "b" : "j") + d.day;
const content = new Map((window.COURSE || []).map(d => [keyOf(d), d]));
// Chapitres numérotés à la suite sur tout le parcours ; leçon = "chapitre.n", bonus = "B.n"
const SEQ = [];
let chapNo = 0;
PARTS.forEach((p, pi) => { p.n = pi + 1; for (const c of p.chapters) {
  c.no = p.bonus ? "B" : String(++chapNo); c.part = p;
  c.items.forEach((key, i) => {
    const d = content.get(key);
    SEQ.push({ key, part: p, chap: c, label: `${c.no}.${i + 1}`, name: `Leçon ${c.no}.${i + 1}`, title: d ? d.title : "À venir", data: d });
  });
} });
const byKey = new Map(SEQ.map(it => [it.key, it]));
const coreItems = SEQ.filter(it => !it.part.bonus);

const KEY = "dotnet30-progress";
let state = { days: {}, ex: {} };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
for (const k of Object.keys(state.days)) if (/^\d+$/.test(k)) { state.days["j" + k] = state.days[k]; delete state.days[k]; }
for (const k of Object.keys(state.ex)) if (/^\d/.test(k)) { state.ex["j" + k] = state.ex[k]; delete state.ex[k]; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ponytail: détection du langage par heuristique, ajouter un champ "lang" aux exemples si elle se trompe
function lang(code) {
  if (/^\s*FROM\s/m.test(code) && /^\s*(RUN|COPY|WORKDIR|ENTRYPOINT)\s/m.test(code)) return "docker";
  if (/^\s*(on|jobs|services):\s*$/m.test(code) || /^\s*- (uses|run|name):/m.test(code)) return "yaml";
  if (/^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) (https?:|\/|\{\{)/m.test(code) || /^HTTP\/[\d.]+ \d{3}/m.test(code)) return "http";
  if (/^\s*(--[^\n]*\n\s*)*(SELECT|CREATE|INSERT|UPDATE|DELETE|ALTER|DECLARE|EXEC|USE|WITH|DROP|MERGE|BEGIN TRAN|SET )/.test(code) && !/\b(using|var|await|public|class)\s/.test(code)) return "sql";
  if (/^\s*(#[^\n]*\n\s*)*(dotnet|docker|npm|ng|git|curl|gh|sqlcmd|winget) /m.test(code) && !/;\s*$/m.test(code)) return "bash";
  if (/^\s*[{[]/.test(code) && /"\s*:/.test(code) && !/;\s*$/m.test(code)) return "json";
  if (/\bimport\s+\{|\bexport\s+(class|const|function|interface)|@Injectable|@Component/.test(code)) return "typescript";
  return "csharp";
}
function codeBlock(code) {
  code = String(code || "").replace(/^\n+|\s+$/g, "");
  const l = lang(code), g = window.Prism && Prism.languages[l];
  const html = g ? Prism.highlight(code, g, l) : esc(code);
  return `<div class="code"><button class="copy" type="button">Copier</button><pre><code class="language-${l}">${html}</code></pre></div>`;
}
const partTitle = p => (p.bonus ? "" : `Partie ${p.n} · `) + p.title;

function renderNav(currentKey) {
  const done = coreItems.filter(it => state.days[it.key]).length;
  document.getElementById("bar").style.width = (done / coreItems.length * 100) + "%";
  const label = `${done} / ${coreItems.length} leçons terminées`;
  document.getElementById("bar-label").textContent = label;
  document.getElementById("bar-label-m").textContent = label;
  const cur = byKey.get(currentKey);
  document.getElementById("nav").innerHTML = PARTS.map(p => `<div class="part"><h2>${esc(partTitle(p))}</h2>${p.chapters.map(c => {
    const its = SEQ.filter(it => it.chap === c);
    const doneN = its.filter(it => state.days[it.key]).length;
    const list = its.map(it => `<li><a href="#${it.key}" class="${state.days[it.key] ? "done" : ""} ${it.data ? "" : "pending"}" ${it.key === currentKey ? 'aria-current="page"' : ""}><span class="n">${it.label}</span><span>${esc(it.title)}</span><span class="chk" aria-label="${state.days[it.key] ? "terminée" : "à faire"}"></span></a></li>`).join("");
    const open = cur ? cur.chap === c : false;
    return `<details class="chap"${open ? " open" : ""}><summary>${c.no === "B" ? "" : c.no + ". "}${esc(c.title)} <small>${doneN}/${its.length}</small></summary><ol>${list}</ol></details>`;
  }).join("")}</div>`).join("");
}

function renderHome() {
  const next = coreItems.find(it => !state.days[it.key]) || coreItems[0];
  const started = SEQ.some(it => state.days[it.key]);
  return `<div class="hero">
    <p class="eyebrow">À ton rythme · .NET 10 / C# 14 · SQL Server</p>
    <h1>Apprendre .NET pas à pas, jusqu'au niveau confirmé</h1>
    <p>Des leçons courtes qui traitent une notion à la fois. On part de zéro avec les fondamentaux du langage, puis on construit des APIs avec ADO.NET, EF Core et ASP.NET Core. Chaque leçon explique d'abord avec une analogie et un schéma, puis montre du code commenté ligne par ligne, avec des exercices corrigés et un mini-quiz.</p>
    <div class="hero-actions">
      <a class="btn primary" href="#${next.key}">${started ? "Reprendre : " + esc(next.name) : "Commencer la leçon 1.1"}</a>
      ${started ? "" : `<a class="btn" href="#${PARTS[1].chapters[0].items[0]}">Je connais déjà C# : partie 2</a>`}
    </div>
  </div>
  <h2 class="home-h">Comment suivre une leçon</h2>
  <div class="split">
    <div><b>1. Comprendre</b><span>Lis l'analogie, le cours et les schémas.</span></div>
    <div><b>2. Taper le code</b><span>Recopie les exemples et compare avec le résultat affiché.</span></div>
    <div><b>3. Pratiquer</b><span>Fais les exercices avant d'ouvrir les solutions.</span></div>
    <div><b>4. Vérifier</b><span>Réponds au quiz, puis coche la leçon.</span></div>
  </div>
  <div class="weeks">${PARTS.map(p => {
    const its = SEQ.filter(it => it.part === p);
    const list = p.chapters.length > 1
      ? p.chapters.map(c => { const ci = its.filter(it => it.chap === c); return `<li><a href="#${ci[0].key}">${c.no}. ${esc(c.title)}</a> <small>${ci.length} leçons</small></li>`; })
      : its.map(it => `<li><a href="#${it.key}">${it.label} · ${esc(it.title)}</a></li>`);
    return `<div class="week-card"><h2>${esc(partTitle(p))} <small>${its.length} leçons</small></h2><p>${esc(p.text)}</p><ul>${list.join("")}</ul></div>`;
  }).join("")}</div>`;
}

function renderQuiz(quiz) {
  return quiz.map((q, qi) => `<div class="quiz-q" data-q="${qi}"><p>${qi + 1}. ${q.q}</p><div class="quiz-opts">${q.options.map((o, oi) => `<button type="button" data-o="${oi}">${o}</button>`).join("")}</div><div class="quiz-why" hidden></div></div>`).join("")
    + `<p class="quiz-score" id="quiz-score" hidden></p>`;
}

function renderLesson(it) {
  const i = SEQ.indexOf(it), p = SEQ[i - 1], nx = SEQ[i + 1], d = it.data;
  const prev = p ? `<a class="btn" href="#${p.key}">← ${esc(p.name)}</a>` : `<a class="btn" href="#accueil">← Accueil</a>`;
  const next = nx ? `<a class="btn" href="#${nx.key}">${esc(nx.name)} →</a>` : `<span></span>`;
  const eyebrow = `${esc(it.name)} · ${esc(partTitle(it.part))}${it.part.chapters.length > 1 ? " · " + esc(it.chap.title) : ""}`;
  if (!d) return `<p class="eyebrow">${eyebrow}</p><h1>${esc(it.title)}</h1><p class="empty">Le contenu de cette leçon n'est pas encore chargé.</p><div class="day-foot">${prev}${next}</div>`;
  const isDone = !!state.days[it.key];
  return `<header class="day-head">
      <p class="eyebrow">${eyebrow}</p>
      <h1>${esc(d.title)}</h1>
      <p class="summary">${esc(d.summary || "")}</p>
    </header>
    <section class="block"><h2>Objectifs</h2><ul class="objectives">${(d.objectives || []).map(o => `<li>${esc(o)}</li>`).join("")}</ul></section>
    <section class="block"><h2>Cours</h2><div class="lesson">${d.analogy ? `<div class="analogy">${d.analogy}</div>` : ""}${d.lesson || ""}</div></section>
    <section class="block"><h2>Exemples <small>tape-les toi-même</small></h2>
      ${(d.examples || []).map(e => `<div class="ex"><h3>${esc(e.title)}</h3>${codeBlock(e.code)}
        ${e.output ? `<div class="output"><pre>${esc(String(e.output).replace(/^\n+|\s+$/g, ""))}</pre></div>` : ""}
        ${(e.steps || []).length ? `<div class="steps"><h4>Ligne par ligne</h4><ol>${e.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>` : ""}
        ${e.explain ? `<p class="explain">${e.explain}</p>` : ""}</div>`).join("")}
    </section>
    <section class="block"><h2>Exercices <small>essaie avant d'ouvrir la solution</small></h2>
      ${(d.exercises || []).map((x, k) => {
        const id = `${it.key}-${k}`;
        return `<div class="task"><div class="task-head"><span class="lvl ${esc(x.level)}">${esc(x.level)}</span><h3>${esc(x.title)}</h3>
          <label class="ex-done"><input type="checkbox" id="ex-${id}" data-ex="${id}" ${state.ex[id] ? "checked" : ""}> Fait</label></div>
          <div>${x.prompt}</div>
          ${x.hint ? `<details><summary>Indice</summary><div>${x.hint}</div></details>` : ""}
          <details><summary>Solution</summary><div>${codeBlock(x.solution)}</div></details></div>`;
      }).join("")}
    </section>
    ${(d.quiz || []).length ? `<section class="block"><h2>Mini-quiz <small>as-tu bien compris ?</small></h2>${renderQuiz(d.quiz)}</section>` : ""}
    ${d.project ? `<section class="block"><h2>${it.key.startsWith("l-") ? "À toi de jouer · Bibliothèque" : "À toi de jouer · OrderFlow"}</h2><div class="project">${d.project}</div></section>` : ""}
    ${(d.resources || []).length ? `<section class="block"><h2>Pour aller plus loin</h2><ul class="resources">${d.resources.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join("")}</ul></section>` : ""}
    <div class="day-foot">${prev}<button class="btn ${isDone ? "is-done" : "primary"}" id="toggle-day" data-key="${it.key}" type="button">${isDone ? "Leçon terminée ✓" : "Marquer la leçon comme terminée"}</button>${next}</div>`;
}

function route() {
  const it = byKey.get(location.hash.slice(1));
  const view = document.getElementById("view");
  view.innerHTML = it ? renderLesson(it) : renderHome();
  // flèches entre les boîtes des schémas de flux
  view.querySelectorAll(".flow").forEach(f => [...f.children].slice(1).forEach(s => { const a = document.createElement("span"); a.className = "arr"; a.setAttribute("aria-hidden", "true"); a.textContent = "→"; f.insertBefore(a, s); }));
  renderNav(it?.key);
  document.title = it ? `${it.label} · ${it.title} · Parcours .NET` : "Parcours .NET";
  document.getElementById("side").classList.remove("open");
  document.getElementById("menu").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  const cur = document.querySelector('.side a[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

document.addEventListener("click", e => {
  const copy = e.target.closest(".copy");
  if (copy) {
    const pre = copy.nextElementSibling;
    navigator.clipboard.writeText(pre.textContent).then(() => { copy.textContent = "Copié"; setTimeout(() => copy.textContent = "Copier", 1500); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    return;
  }
  const opt = e.target.closest(".quiz-opts button");
  if (opt) {
    const box = opt.closest(".quiz-q"), q = byKey.get(location.hash.slice(1)).data.quiz[+box.dataset.q], chosen = +opt.dataset.o;
    box.querySelectorAll("button").forEach((b, bi) => { b.disabled = true; if (bi === q.answer) b.classList.add("right"); else if (bi === chosen) b.classList.add("wrong"); });
    box.dataset.ok = String(chosen === q.answer);
    const why = box.querySelector(".quiz-why");
    why.innerHTML = `<b>${chosen === q.answer ? "Bonne réponse." : "Pas tout à fait."}</b> ${q.why || ""}`;
    why.hidden = false;
    const all = document.querySelectorAll(".quiz-q"), answered = [...all].filter(b => b.dataset.ok);
    if (answered.length === all.length) {
      const score = answered.filter(b => b.dataset.ok === "true").length, el = document.getElementById("quiz-score");
      el.textContent = score === all.length ? `${score}/${all.length} : tout est bon, tu peux passer à la suite.` : `${score}/${all.length} : relis les explications ci-dessus avant de continuer.`;
      el.hidden = false;
    }
    return;
  }
  if (e.target.id === "toggle-day") {
    const key = e.target.dataset.key;
    state.days[key] = !state.days[key]; save();
    e.target.className = "btn " + (state.days[key] ? "is-done" : "primary");
    e.target.textContent = state.days[key] ? "Leçon terminée ✓" : "Marquer la leçon comme terminée";
    renderNav(key);
  }
  if (e.target.id === "menu") {
    const open = document.getElementById("side").classList.toggle("open");
    e.target.setAttribute("aria-expanded", String(open));
  }
});
document.addEventListener("change", e => { const id = e.target.dataset.ex; if (id) { state.ex[id] = e.target.checked; save(); } });
window.addEventListener("hashchange", route);
route();
</script>
